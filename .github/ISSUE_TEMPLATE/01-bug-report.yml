# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: Bug report
description: Report something that is broken.
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can it be reproduced?
      description: Steps, or a minimal repository.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions, operating system and package manager.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output or error messages.
      render: shell
