name: Workspace

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    permissions:
      contents: write
      id-token: write
    uses: langri-sha/github/.github/workflows/check.yml@v0.31.0
    with:
      beachball: true
      dagger: true
      dagger-version: v1.0.0-beta.21
      eslint: true
      packages: true
      prettier: true
      projen: true
      typescript: true
      vitest: true
    secrets: inherit

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: langri-sha/github/actions/pnpm@v0.31.0
      - run: pnpm smoke
